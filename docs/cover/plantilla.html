<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RIMPILOT cover</title>
<!--
  Portada de la convocatoria, 1920×1080. Se renderiza con `render.mjs`, que
  inyecta la fuente y el logo como data URI para que el archivo sea autónomo.

  La mitad derecha es el libro mismo: las cuatro cifras apiladas como filas, con
  la caja separada por una regla porque es el resultado de la resta y no un
  rubro más. Los colores salen de DESIGN.md —cian lo que entró, rosa lo que
  salió por el negocio, violeta lo que se llevó la persona— y ninguna cifra
  depende solo del color: cada fila lleva su etiqueta.
-->
<style>
  @font-face {
    font-family: "Inter Variable";
    src: url("__FUENTE__") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }
  :root {
    --bg: #080D1A; --surface: #0F1728; --line: #22304F;
    --ink: #F2F5FF; --muted: #9AABCE;
    --cyan: #01B2F8; --violet: #A78BFA; --rose: #FB7185;
    --grad: linear-gradient(120deg, #824CE8 0%, #4F73EF 52%, #01B2F8 100%);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1920px; height: 1080px; background: var(--bg); color: var(--ink);
    font-family: "Inter Variable", sans-serif; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr; padding: 74px 104px 82px;
    overflow: hidden; position: relative;
  }

  /* Resplandor apenas perceptible detrás del libro: da profundidad sin competir. */
  .brillo {
    position: absolute; top: -420px; right: -300px; width: 1240px; height: 1240px;
    background: radial-gradient(circle, rgba(130, 76, 232, .22) 0%, rgba(1, 178, 248, .08) 46%, transparent 70%);
    pointer-events: none;
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  header img { width: 268px; height: auto; }
  .evento {
    border: 1px solid var(--line); border-radius: 999px; padding: 14px 26px;
    color: var(--muted); font-size: 22px; font-weight: 650; letter-spacing: .01em;
  }

  main {
    display: grid; grid-template-columns: 1.08fr 1fr; gap: 104px;
    align-items: center; position: relative;
  }

  h1 { font-size: 118px; line-height: .96; letter-spacing: -.055em; font-weight: 800; }
  h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bajada { margin-top: 30px; font-size: 33px; color: var(--muted); line-height: 1.38; }

  .remate { margin-top: 54px; display: flex; align-items: center; gap: 26px; }
  .regla { width: 118px; height: 6px; border-radius: 3px; background: var(--grad); flex: none; }
  .remate p { font-size: 29px; font-weight: 600; letter-spacing: -.015em; }
  .remate em { color: var(--muted); font-style: normal; }

  .libro {
    background: var(--surface); border: 1px solid var(--line); border-radius: 30px;
    padding: 20px 52px 26px;
  }
  .fila {
    display: flex; align-items: baseline; justify-content: space-between; gap: 40px;
    padding: 30px 0; border-bottom: 1px solid var(--line);
  }
  .fila span { font-size: 27px; color: var(--muted); font-weight: 600; }
  .fila strong {
    font-size: 66px; letter-spacing: -.05em; font-weight: 800;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  }
  .entra strong { color: var(--cyan); }
  .sale strong { color: var(--rose); }
  .retiro strong { color: var(--violet); }
  /* La caja cierra el libro: sin borde abajo y con la etiqueta en tinta plena. */
  .caja { border-bottom: 0; padding-top: 34px; }
  .caja span { color: var(--ink); font-weight: 700; }
  .caja strong { color: var(--cyan); font-size: 76px; }
</style>
</head>
<body>
  <div class="brillo"></div>

  <header>
    <img src="__LOGO__" alt="RIMPILOT">
    <span class="evento">AssemblyAI Voice Agent Hackathon 2026</span>
  </header>

  <main>
    <div>
      <h1>The ledger<br><span>you talk to</span></h1>
      <p class="bajada">Voice bookkeeping for Peru's informal vendors.</p>
      <div class="remate">
        <span class="regla"></span>
        <p>She sold 75. She has 40. <em>Now she knows why.</em></p>
      </div>
    </div>

    <div class="libro">
      <div class="fila entra"><span>Sales</span><strong>S/ 75</strong></div>
      <div class="fila sale"><span>Expenses</span><strong>−S/ 15</strong></div>
      <div class="fila retiro"><span>She took out</span><strong>−S/ 20</strong></div>
      <div class="fila caja"><span>Cash</span><strong>S/ 40</strong></div>
    </div>
  </main>
</body>
</html>
